<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeGame</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score:
                        <span id="high-score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Score:
                        <span id="score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Time:
                        <span id="time">00-00</span>
                    </h3>
                </div>
            </div>
            <div class="board">
            </div>
            <div class="controls-wrapper">
                <div class="control-modes">
                    <button type="button" class="mode-btn" data-mode="joystick">🕹️ Joystick</button>
                    <button type="button" class="mode-btn" data-mode="dpad">🎛️ D-Pad</button>
                </div>
                <!-- Joystick Control -->
                <div class="joystick-wrapper" id="joystick-wrapper">
                    <div class="joystick-base" id="joystick-base">
                        <span class="joy-indicator joy-up">▲</span>
                        <span class="joy-indicator joy-down">▼</span>
                        <span class="joy-indicator joy-left">◀</span>
                        <span class="joy-indicator joy-right">▶</span>
                        <div class="joystick-knob" id="joystick-knob"></div>
                    </div>
                </div>
                <!-- D-Pad Buttons Control -->
                <div class="controls dpad-controls" id="dpad-controls" style="display: none;">
                    <div class="controls-row">
                        <button type="button" class="ctrl-btn up" data-dir="up" aria-label="Up">▲</button>
                    </div>
                    <div class="controls-row">
                        <button type="button" class="ctrl-btn left" data-dir="left" aria-label="Left">◀</button>
                        <button type="button" class="ctrl-btn down" data-dir="down" aria-label="Down">▼</button>
                        <button type="button" class="ctrl-btn right" data-dir="right" aria-label="Right">▶</button>
                    </div>
                </div>
            </div>
        </section>
        <div class="modal">
            <div class="start-game">
                <h3>Welcome to snake game</h3>
                <button class="btn btn-start">Start Game</button>
            </div>
            <div class="game-over">
                <h3>Game Over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
